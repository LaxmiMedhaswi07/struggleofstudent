<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="ssGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="ssGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Rounded Shield Background -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="#0F172A" stroke="url(#ssGrad1)" stroke-width="2.5" />
    
    <!-- Stylized Dual SS Monogram with Upward Growth Dynamic -->
    <!-- First 'S' -->
    <path d="M44 26 C38 23 28 25 28 32 C28 39 42 41 42 48 C42 55 32 57 26 53" 
          stroke="url(#ssGrad1)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Second 'S' Intersecting with Momentum Glow -->
    <path d="M56 34 C50 31 40 33 40 40 C40 47 54 49 54 56 C54 63 44 65 38 61" 
          stroke="url(#ssGrad2)" stroke-width="5.5" stroke-linecap="round" fill="none" filter="url(#glow)" />

    <!-- Uplifting Spark / Opportunity Star -->
    <circle cx="56" cy="24" r="3.5" fill="#38BDF8" />
    <path d="M56 18 L57.5 22.5 L62 24 L57.5 25.5 L56 30 L54.5 25.5 L50 24 L54.5 22.5 Z" fill="#38BDF8" />
  </g>

  <!-- Text Section -->
  <!-- SS Monogram Pill -->
  <g transform="translate(106, 24)">
    <rect x="0" y="2" width="38" height="22" rx="6" fill="url(#ssGrad1)" />
    <text x="19" y="18" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="1">SS</text>
    
    <!-- Main Brand Name -->
    <text x="48" y="20" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">STRUGGLE OF STUDENT</text>
  </g>

  <!-- Tagline -->
  <text x="108" y="72" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12.5" letter-spacing="0.5">
    A platform built by students, for students.
  </text>
</svg>
